[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-format-converter"
version = "1.0.0"
description = "Convert records between CSV, JSON arrays, and JSON Lines with encoding and delimiter controls."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jellywong343-sys" }]
dependencies = []
keywords = ["python","csv","json","jsonlines","data-conversion"]

[project.scripts]
data-convert = "data_format_converter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
